# Hook PostSync aplikacji app11: rusza po zakonczeniu fazy Sync (job.yaml).
# Nazwa jest stala, bo BeforeHookCreation usuwa starego Joba przed utworzeniem
# nowego.
#
# Aby zasymulowac awarie, zmien "exit 0" na "exit 1".
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant0-app11-postsync
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postsync
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "$(date -u +%H:%M:%S) tenant0 app11 POSTSYNC START"
              sleep 15
              echo "$(date -u +%H:%M:%S) tenant0 app11 POSTSYNC END"
              exit 0
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
