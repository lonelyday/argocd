# Aplikacja testowa app11: hook PreSync (precheck.yaml) + hook Sync (ten plik)
# + hook PostSync (postsync.yaml).
#
# Job jest hookiem fazy Sync, wiec Argo tworzy go od nowa przy kazdym ponowieniu
# operacji (BeforeHookCreation) i nazwa moze byc stala.
#
# Zachowanie: PIERWSZA proba konczy sie "exit 1", kazda kolejna "exit 0".
# Numer proby zapisuje plik /state/attempt na PVC (pvc.yaml), bo pod jest za kazdym
# razem nowy. Z retryLimit: 1 daje to: proba 0 = Failed, ponowienie = sukces.
# Zeby miec zawsze sukces albo zawsze porazke, zmien warunek w skrypcie.
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant0-app11-job
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: job
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              f=/state/attempt
              n=$(cat $f 2>/dev/null || echo 0)
              n=$((n+1))
              echo "$n" > $f
              echo "$(date -u +%H:%M:%S) tenant0 app11 v35 JOB START (attempt $n)"
              sleep 15
              if [ "$n" -eq 1 ]; then
                echo "$(date -u +%H:%M:%S) tenant0 app11 v35 JOB END (attempt $n) FAIL"
                exit 1
              fi
              echo "$(date -u +%H:%M:%S) tenant0 app11 v35 JOB END (attempt $n) OK"
              exit 0
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: app11-state-v35
