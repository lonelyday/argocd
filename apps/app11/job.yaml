# Aplikacja testowa app11: hook PreSync (precheck.yaml) + zwykly Job w fazie Sync
# (ten plik). Precheck rusza przed tym Jobem.
#
# Aby zasymulowac awarie, zmien "exit 0" na "exit 1".
#
# Job jest niezmienny: kolejny upgrade wymaga nowej nazwy (numer wersji w nazwie).
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant0-app11-job-v30
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: job
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "$(date -u +%H:%M:%S) tenant0 app11 v30 JOB START"
              sleep 15
              echo "$(date -u +%H:%M:%S) tenant0 app11 v30 JOB END"
              exit 0
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
