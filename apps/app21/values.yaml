# Values of the app21 chart. Edit them BEFORE the chart is deployed.

# Image used by the nginx Deployment AND by the PostSync health check (it contains curl).
# Failure test (tag v38): set a tag that does not exist, e.g. :v0-does-not-exist, and the pods end in ImagePullBackOff.
image: registry.access.redhat.com/ubi9/nginx-126:latest

# Number of nginx pods.
replicas: 1

# Seconds after which a Deployment that makes no progress (e.g. ImagePullBackOff) is reported as failed:
# Kubernetes sets Progressing=False and Argo CD marks the Deployment Degraded. The Kubernetes default is 600.
progressDeadlineSeconds: 60

presync:
  # Seconds the PreSync hook sleeps (simulated work).
  sleepSeconds: 10
  # Exit code of the PreSync hook. 0 = success; any other value fails the operation
  # before the Sync phase starts (no Deployment is created or changed).
  exitCode: 0

postsync:
  # How many times the health check calls the Service before it gives up.
  attempts: 12
  # Pause between two attempts, in seconds.
  intervalSeconds: 5
  # HTTP path checked by the PostSync hook. /healthz is defined in the nginx ConfigMap.
  path: /healthz
