# app21, PreSync hook: runs BEFORE the Sync phase and exits with .Values.presync.exitCode.
#
# With exit code 0 the Sync phase starts. With any other code the operation ends as
# "Failed" and nothing is deployed.
#
# The name is fixed because BeforeHookCreation deletes the old Job before creating a new one.
#
# VALUES THE USER MAY CONFIGURE
#   argocd.argoproj.io/hook: PreSync        run before the Sync phase.
#   presync.sleepSeconds                    simulated work (values.yaml).
#   presync.exitCode                        0 = success (values.yaml).
#   image                                   ubi-minimal is enough, no extra tools are needed.
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant0-app21-presync
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: presync
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "$(date -u +%H:%M:%S) tenant0 app21 chart {{ .Chart.Version }} PRESYNC START"
              sleep {{ .Values.presync.sleepSeconds }}
              echo "$(date -u +%H:%M:%S) tenant0 app21 chart {{ .Chart.Version }} PRESYNC END (exit {{ .Values.presync.exitCode }})"
              exit {{ .Values.presync.exitCode }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
